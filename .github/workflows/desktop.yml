# Desktop apps: build each one and run the shared integration_test flows on it.
# Linux runs on every push and pull request (Linux minutes are the cheap ones,
# and nothing else builds the Linux app). Windows (2x minutes) and macOS (10x)
# run only when started by hand (Actions › Desktop apps › Run workflow).
name: Desktop apps

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - name: Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb
      - name: Get packages
        working-directory: app
        run: flutter pub get
      - name: Build
        working-directory: app
        run: flutter build linux --release
      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: app/build/linux/x64/release/bundle
          retention-days: 7
      # One file per run: a second app launch in the same `flutter test` call
      # can lose its debug connection on desktop. host_test.dart skips itself.
      - name: Integration flows (virtual display)
        working-directory: app
        run: |
          for f in app_test ui_flows_test; do
            xvfb-run -a flutter test integration_test/$f.dart -d linux
          done

  windows:
    name: Windows
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - name: Get packages
        working-directory: app
        run: flutter pub get
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: app/build/windows/x64/runner/Release
          retention-days: 7
      - name: Integration flows
        working-directory: app
        run: |
          for f in app_test ui_flows_test; do
            flutter test integration_test/$f.dart -d windows
          done

  macos:
    name: macOS
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - name: Get packages
        working-directory: app
        run: flutter pub get
      - name: Build
        working-directory: app
        run: flutter build macos --release
      - name: Integration flows
        working-directory: app
        run: |
          for f in app_test ui_flows_test; do
            flutter test integration_test/$f.dart -d macos
          done
