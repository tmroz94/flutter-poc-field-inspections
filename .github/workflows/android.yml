# Android device tests on an emulator (same image as the local one: API 37,
# Google Play, x86_64): the integration_test flows including the host-driven
# airplane-mode and GPS steps, then the Patrol native UI tests and the
# notification-after-kill check. Slow (≈45–60 min), so it runs only when
# started by hand (Actions › Android device tests › Run workflow).
name: Android device tests

on:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: Emulator (API 37)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      # app/android/gradle.properties gives the Gradle daemon 8 GB for local
      # builds; the runner shares its RAM with the emulator, so give Gradle less.
      # The user-home properties file takes precedence over the project's.
      - name: Gradle memory for the runner
        run: |
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError'
            echo 'kotlin.daemon.jvmargs=-Xmx1g'
          } >> ~/.gradle/gradle.properties
      # patrol_cli 4.7.0+ works with patrol 4.9.0+ (Patrol compatibility table);
      # 4.8.0 is the version used locally. Update it together with `patrol`.
      - name: Get packages and Patrol CLI
        run: |
          (cd app && flutter pub get)
          (cd mock_server && dart pub get)
          dart pub global activate patrol_cli 4.8.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene
          script: |
            dart tool/android_device_tests.dart --device emulator-5554
            dart tool/android_device_tests.dart --device emulator-5554 --patrol
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: |
            app/build/app/reports/androidTests
            app/build/app/outputs/androidTest-results
          retention-days: 7
