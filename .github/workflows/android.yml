# Android device tests on an emulator (API 36, Google APIs, x86_64): the
# integration_test flows including the host-driven airplane-mode and GPS steps,
# then the Patrol native UI tests and the notification-after-kill check. Slow
# (≈45–60 min), so it runs only when started by hand (Actions › Android device
# tests › Run workflow). Not the local image (API 37, Google Play): on the
# runner its system crashed minutes after every boot, with either GPU mode
# (runs 40947086623 and 41486170144, decision 87).
name: Android device tests

on:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: Emulator (API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      # app/android/gradle.properties gives the Gradle daemon 8 GB for local
      # builds; the runner shares its RAM with the emulator, so give Gradle less.
      # No lasting daemons: the prebuild's Gradle and Kotlin daemons (three java
      # processes) stayed alive through the tests, and in run 41513210914 the
      # emulator vanished during a test build, with no crash on either side.
      # Each build now ends its own JVMs and compiles Kotlin in-process.
      # The user-home properties file takes precedence over the project's.
      - name: Gradle memory for the runner
        run: |
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError'
            echo 'org.gradle.daemon=false'
            echo 'kotlin.compiler.execution.strategy=in-process'
          } >> ~/.gradle/gradle.properties
      # patrol_cli 4.7.0+ works with patrol 4.9.0+ (Patrol compatibility table);
      # 4.8.0 is the version used locally. Update it together with `patrol`.
      - name: Get packages and Patrol CLI
        run: |
          (cd app && flutter pub get)
          (cd mock_server && dart pub get)
          dart pub global activate patrol_cli 4.8.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      # One full Gradle build before the emulator starts, so the slowest build
      # doesn't compete with the emulator; the test builds reuse its outputs.
      - name: Build the app once
        run: cd app && flutter build apk --debug --target integration_test/app_test.dart
      # A cold boot on the runner left Android's system services failing
      # ("Broken pipe" from input and package), so installs failed before any
      # test ran. The emulator gets the runner's 4 cores and fixed RAM, boots
      # once to save a snapshot (cached between runs), and the tests start from
      # that warm state. Change the key when the emulator settings change.
      # GPU: swangle (ANGLE on SwiftShader). With swiftshader_indirect the
      # Android 37 image's surfaceflinger aborted ~35 s after every boot
      # ("Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma" in
      # the goldfish mapper), restarting the whole system and its packages.
      - name: AVD cache
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-google_apis-x86_64-pixel_7-4cores-4g-swangle-v1
      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '36'
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          disk-size: 8G
          force-avd-creation: false
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back virtualscene
          script: echo "AVD snapshot saved."
      - name: Device tests
        # A backstop: each pass below has its own limit.
        timeout-minutes: 80
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '36'
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          disk-size: 8G
          force-avd-creation: false
          emulator-boot-timeout: 900
          disable-animations: false
          # From the snapshot, without writing the test run's state back to it.
          emulator-options: -no-snapshot-save -no-window -gpu swangle -noaudio -no-boot-anim -camera-back virtualscene
          # The action runs each line on its own (sh -c). First: the whole
          # logcat and the runner's free memory every 10 s to files, in the
          # background, for the artifact. Then wait
          # until the package manager answers (in run 40938499241 the app
          # installed, but its activity then wasn't found). Each pass has 35
          # minutes (SIGTERM lets the runner restore the device; SIGKILL 2
          # minutes later): in run 41486170144 the failure path hung for 76
          # minutes after the emulator died. On a failure, save what the
          # emulator knows (tool/ci_android_diagnostics.sh).
          script: |
            mkdir -p app/build/ci-diagnostics && (adb -s emulator-5554 logcat -v threadtime > app/build/ci-diagnostics/logcat.txt 2>&1 &)
            (while :; do date -u +%T; free -m | sed -n 2,3p; sleep 10; done > app/build/ci-diagnostics/host-memory.txt 2>&1 &)
            timeout 300 sh -c 'until adb -s emulator-5554 shell pm path android 2>/dev/null | grep -q package:; do sleep 5; done' && echo "Package manager ready."
            timeout -k 2m 35m dart tool/android_device_tests.dart --device emulator-5554 || (sh tool/ci_android_diagnostics.sh; exit 1)
            timeout -k 2m 35m dart tool/android_device_tests.dart --device emulator-5554 --patrol || (sh tool/ci_android_diagnostics.sh; exit 1)
      # Also when the job was cancelled or timed out, which is when the
      # evidence matters most.
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: android-test-reports
          path: |
            app/build/app/reports/androidTests
            app/build/app/outputs/androidTest-results
            app/build/ci-diagnostics
          retention-days: 7
