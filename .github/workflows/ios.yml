# iOS on a simulator (macOS runner): builds the app for iOS and runs the shared
# integration_test flows. macOS minutes are billed at 10× the Linux rate on
# private repositories, so this runs only when started by hand (Actions ›
# iOS simulator tests › Run workflow).
name: iOS simulator tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: iPhone simulator
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - name: Get packages
        working-directory: app
        run: flutter pub get
      - name: Boot an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Using simulator $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # host_test.dart is Android-only (adb) and skips itself here.
      - name: Integration flows on the simulator
        working-directory: app
        run: flutter test integration_test -d ${{ steps.sim.outputs.udid }}
      # permission_handler compiles in only the permissions whose usage strings
      # are in Info.plist (its Swift package reads them); log what it resolved.
      # Flutter links each plugin's package as <name>-<version> in .packages.
      - name: permission_handler macros
        if: always()
        continue-on-error: true
        working-directory: app
        run: |
          pkg=$(ls -d ios/Flutter/ephemeral/Packages/.packages/permission_handler_apple-* | head -n 1)
          PERMISSION_HANDLER_VERBOSE=1 swift package --manifest-cache none --package-path "$pkg" dump-package > /dev/null
      - name: Screenshot on failure
        if: failure()
        run: xcrun simctl io ${{ steps.sim.outputs.udid }} screenshot ios-failure.png
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-failure
          path: ios-failure.png
          if-no-files-found: ignore
          retention-days: 7
