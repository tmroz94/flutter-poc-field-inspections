# Local builds. CI (.github/workflows/android.yml) overrides this with a smaller
# heap in ~/.gradle/gradle.properties, which takes precedence over this file.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin (AGP 9, Flutter 3.47+): AGP compiles the Kotlin. The app applies
# no Kotlin Gradle Plugin, and patrol skips it when this is true. Flutter still
# warns that patrol applies KGP: it scans patrol's build.gradle, where the apply
# is conditional.
android.builtInKotlin=true

# Kotlin incremental caches break when the project (D:) and pub cache (C:) are on
# different drives on Windows: "Could not close incremental caches".
kotlin.incremental=false
